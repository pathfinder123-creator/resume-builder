<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics 4: shared Career Center measurement -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder &amp; Job-Match Coach</title>
<style>
  :root{
    --ink:#1E2A3D;
    --collin-blue:#0C2E82;
    --paper:#FAFAF7;
    --panel:#FFFFFF;
    --kraft:#C9A66B;
    --kraft-dark:#A9803F;
    --teal:#2C6E63;
    --teal-dark:#1E4F47;
    --slate:#57626F;
    --slate-light:#8C95A1;
    --line:#DEDAD0;
    --amber:#B8752E;
    --amber-bg:#FBF1E3;
    --green:#3F7D58;
    --green-bg:#EAF3ED;
    --red:#B3452C;
    --red-bg:#FBEAE4;
    --radius:6px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input, textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--collin-blue);
    color:var(--paper);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--kraft);
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand img{height:44px;width:auto;display:block;background:#fff;border-radius:4px;padding:4px 8px;}
  header.top .title-block h1{
    font-family:var(--serif);
    font-size:1.25rem;
    margin:0 0 2px 0;
    font-weight:700;
    letter-spacing:0.01em;
  }
  header.top .title-block p{
    margin:0;
    font-size:0.78rem;
    color:#C9D3EA;
    font-family:var(--mono);
    letter-spacing:0.03em;
  }
  header.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:9px 14px;
    font-size:0.85rem;
    font-weight:600;
    transition:transform .04s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--paper);border-color:#4A5468;}
  .btn-ghost:hover{border-color:var(--kraft);}
  .btn-outline{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-outline:hover{border-color:var(--slate);}
  .btn-small{padding:5px 10px;font-size:0.75rem;}
  .btn-remove{background:none;border:none;color:var(--red);font-size:0.78rem;font-weight:600;text-decoration:underline;padding:2px 0;}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:210px minmax(320px,1fr) 380px;min-height:calc(100vh - 66px);}
  @media (max-width:1080px){
    .app{grid-template-columns:1fr;}
    .rail{display:flex;overflow-x:auto;padding:10px 18px 10px 12px;gap:7px;border-right:0;border-bottom:1px solid var(--line);scroll-padding-inline:12px;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;}
    .rail .tab{width:auto;max-width:calc(100vw - 42px);min-height:44px;flex:0 0 auto;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:.78rem;gap:6px;white-space:nowrap;scroll-snap-align:start;}
    .rail .tab.active{border:2px solid var(--kraft-dark);background:#FFFDF9;padding:7px 10px;}
    .rail .tab .opt{display:none;}
    .rail .tab .dot{width:7px;height:7px;}
    .preview-col{border-top:6px solid var(--kraft);}
  }

  /* ---------- Tab rail (binder tabs) ---------- */
  .rail{
    background:#F1EEE6;
    padding:20px 0;
    border-right:1px solid var(--line);
  }
  .tab{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:4px solid transparent;
    padding:11px 14px;
    font-size:0.83rem;
    color:var(--slate);
    font-weight:600;
  }
  .tab .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--line);
    flex:0 0 auto;
  }
  .tab.complete .dot{background:var(--teal);}
  .tab.active{
    background:var(--panel);
    color:var(--ink);
    border-left-color:var(--kraft-dark);
  }
  .tab .opt{
    font-family:var(--mono);
    font-size:0.62rem;
    color:var(--slate-light);
    font-weight:400;
    margin-left:auto;
  }

  /* ---------- Form column ---------- */
  .form-col{padding:28px 30px;background:var(--panel);overflow-y:auto;}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 4px 0;}
  .section-head .guide{
    font-size:0.85rem;color:var(--slate);
    background:var(--amber-bg);
    border-left:3px solid var(--kraft-dark);
    padding:9px 12px;
    border-radius:0 var(--radius) var(--radius) 0;
    margin-top:8px;
  }
  label{display:block;font-size:0.78rem;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:0.01em;}
  label.full{margin-top:14px;}
  .hint{font-weight:400;font-size:0.78rem;color:var(--slate-light);margin-bottom:6px;font-style:italic;}
  input[type=text], input[type=email], input[type=tel], textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:0.92rem;
    color:var(--ink);
    background:#fff;
    margin-bottom:14px;
  }
  input:focus, textarea:focus, button:focus, .tab:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.45;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}
  .entry-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:16px;
    background:#FDFCFA;
    position:relative;
  }
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .entry-num{font-family:var(--mono);font-size:0.72rem;color:var(--kraft-dark);font-weight:700;letter-spacing:0.04em;}
  .add-btn{
    background:#fff;border:1.5px dashed var(--slate-light);color:var(--slate);
    border-radius:var(--radius);padding:10px;width:100%;font-size:0.85rem;font-weight:600;
  }
  .add-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .coach-feedback{margin-top:6px;font-size:0.78rem;}
  .flag{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border-radius:5px;margin-bottom:5px;line-height:1.4;}
  .flag.amber{background:var(--amber-bg);color:#7A4D1D;}
  .flag.red{background:var(--red-bg);color:#7C3018;}
  .flag.green{background:var(--green-bg);color:#265239;}
  .flag b{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;margin-right:2px;}

  .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:0.78rem;
    border:1px solid var(--line);
  }
  .chip.matched{background:var(--green-bg);color:#265239;border-color:#BFE0CC;}
  .chip.missing{background:var(--amber-bg);color:#7A4D1D;border-color:#EAD3A6;}

  /* ---------- Preview column ---------- */
  .preview-col{
    background:#EFECE3;
    padding:26px 22px;
    overflow-y:auto;
    border-left:1px solid var(--line);
  }
  .preview-label{
    font-family:var(--mono);font-size:0.72rem;color:var(--slate);
    text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  .paper{
    background:#fff;
    box-shadow:0 2px 14px rgba(30,42,61,0.14);
    padding:0.65in 0.6in;
    min-height:9in;
    font-family:Aptos, Arial, Helvetica, sans-serif;
    font-size:10.4pt;
    color:#111;
    line-height:1.35;
  }
  .r-name{text-align:center;font-size:19pt;font-weight:700;margin:0 0 2px 0;}
  .r-contact{text-align:center;font-size:9.5pt;margin:0 0 14px 0;color:#222;}
  .r-h-table{width:100%;border-collapse:collapse;margin:16px 0 6px 0;}
  .r-h{font-weight:700;font-size:12.5pt;letter-spacing:0.02em;border-bottom:1.4pt solid #111;padding-bottom:2px;text-align:left;}
  .r-row-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10.2pt;}
  .r-row-table td{padding:0;vertical-align:top;}
  .r-row-table td.r-right{text-align:right;white-space:nowrap;padding-left:12px;}
  .r-row b{font-weight:700;}
  .r-title{font-style:italic;font-size:10.2pt;margin:1px 0 3px 0;}
  .r-ul{margin:2px 0 0 0;padding-left:18px;}
  .r-ul li{margin-bottom:2px;}
  .r-empty{color:#9AA1AA;font-style:italic;}
  .r-p{margin:0 0 4px 0;}
  .r-proj-title{font-weight:700;font-size:10.2pt;margin:8px 0 0 0;}

  /* Resume spacing presets. Font sizes remain fixed. */
  .paper.layout-spacious{line-height:1.48;}
  .paper.layout-spacious .r-contact{margin-bottom:16px;}
  .paper.layout-spacious .r-h-table{margin:20px 0 8px 0;}
  .paper.layout-spacious .r-row-table{margin-top:10px;}
  .paper.layout-spacious .r-title{margin:2px 0 5px 0;}
  .paper.layout-spacious .r-ul{margin:3px 0 10px 0;}
  .paper.layout-spacious .r-ul li{margin-bottom:3px;}
  .paper.layout-spacious .r-p{margin-bottom:7px;}
  .paper.layout-spacious .r-proj-title{margin-top:10px;}
  .paper.layout-compact{line-height:1.2;}
  .paper.layout-compact .r-contact{margin-bottom:10px;}
  .paper.layout-compact .r-h-table{margin:12px 0 4px 0;}
  .paper.layout-compact .r-row-table{margin-top:6px;}
  .paper.layout-compact .r-title{margin:0 0 2px 0;}
  .paper.layout-compact .r-ul{margin:1px 0 4px 0;}
  .paper.layout-compact .r-ul li{margin-bottom:1px;}
  .paper.layout-compact .r-p{margin-bottom:3px;}
  .paper.layout-compact .r-proj-title{margin-top:5px;}
  .resume-measure{position:absolute!important;left:-10000px!important;top:0!important;width:7in!important;min-height:0!important;padding:0!important;box-shadow:none!important;visibility:hidden!important;}
  .layout-select{width:100%;max-width:290px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;}

  .save-status{font-size:0.72rem;color:var(--slate);font-family:var(--mono);}
  .save-status button{background:none;border:none;color:var(--teal-dark);text-decoration:underline;font-size:0.72rem;font-family:var(--mono);padding:0;margin-left:8px;}

  .review-block{margin-bottom:22px;}
  .review-block h3{font-family:var(--serif);font-size:1.05rem;margin:0 0 8px 0;}
  .count-pill{display:inline-flex;align-items:center;gap:6px;background:#F1EEE6;border-radius:999px;padding:4px 12px;font-size:0.8rem;margin-right:8px;margin-bottom:6px;}
  .footer-note{font-size:0.78rem;color:var(--slate);margin-top:6px;}

  input[type=file]{display:none;}


  /* ---------- Optional AI polish ---------- */
  .ai-polish{margin-top:12px;border:1px solid #C8D8EF;border-radius:8px;background:#F6F9FF;padding:12px;}
  .ai-polish-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .ai-polish-title{font-size:0.82rem;font-weight:800;color:var(--collin-blue);}
  .ai-polish-note{font-size:0.76rem;color:var(--slate);margin-top:3px;line-height:1.4;}
  .ai-result{display:none;margin-top:10px;}
  .ai-result.show{display:block;}
  .ai-output{border:1px solid #CFD9E8;background:#fff;border-radius:7px;padding:11px;font-size:0.88rem;line-height:1.5;white-space:pre-wrap;}
  .ai-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .ai-status{margin-top:7px;font-size:0.76rem;color:var(--slate);}


  /* ---------- Mobile guided workflow ---------- */
  .mobile-workflow-bar,.mobile-preview{display:none;}
  @media (max-width:760px){
    body{padding-bottom:76px;}
    header.top{padding:10px 12px;gap:9px;}
    header.top .brand{gap:9px;min-width:0;align-items:center;}
    header.top .brand img{height:34px;padding:3px 6px;}
    header.top .title-block{min-width:0;}
    header.top .title-block h1{font-size:1rem;line-height:1.15;}
    header.top .title-block p{display:none;}
    header.top .actions{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
    header.top .actions .btn{flex:0 0 auto;white-space:nowrap;padding:7px 10px;font-size:.74rem;}

    .app{display:block;min-height:auto;}
    .rail{position:sticky;top:0;z-index:20;display:flex;overflow-x:auto;padding:8px 10px;gap:7px;border-right:0;border-bottom:1px solid var(--line);background:#F1EEE6;box-shadow:0 2px 8px rgba(30,42,61,.08);scrollbar-width:none;}
    .rail::-webkit-scrollbar{display:none;}
    .rail .tab{width:auto;flex:0 0 auto;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:.76rem;gap:6px;white-space:nowrap;}
    .rail .tab.active{border:2px solid var(--kraft-dark);background:#FFFDF9;padding:7px 10px;}
    .rail .tab .opt{display:none;}
    .rail .tab .dot{width:7px;height:7px;}

    .form-col{padding:20px 14px 24px;overflow:visible;}
    .section-head{margin-bottom:14px;}
    .section-head h2{font-size:1.2rem;}
    .section-head .guide{font-size:.8rem;}
    input[type=text],input[type=email],input[type=tel],textarea{font-size:16px;padding:11px 12px;margin-bottom:13px;}
    textarea{min-height:92px;}
    .entry-card{padding:14px 12px;margin-bottom:14px;}
    .btn{min-height:42px;}
    .btn-small{min-height:38px;padding:8px 11px;}
    .add-btn{min-height:46px;}
    .ai-polish{padding:12px 10px;}
    .ai-polish-head{align-items:stretch;}
    .ai-polish-head .btn{width:100%;}
    .ai-actions{display:grid;grid-template-columns:1fr;}
    .ai-actions .btn{width:100%;}

    .preview-col{display:none;}
    .mobile-workflow-bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(30,42,61,.12);}
    .mobile-workflow-bar button{min-height:46px;border-radius:8px;font-size:.78rem;font-weight:700;}
    .mobile-workflow-bar .mobile-prev{text-align:left;}
    .mobile-workflow-bar .mobile-next{text-align:right;}
    .mobile-workflow-bar .mobile-preview-btn{padding-left:12px;padding-right:12px;}
    .mobile-workflow-bar button:disabled{opacity:.4;cursor:not-allowed;}

    .mobile-preview{position:fixed;inset:0;z-index:100;background:#EAE7DE;overflow:auto;padding:0 0 28px;}
    .mobile-preview.open{display:block;}
    .mobile-preview-head{position:sticky;top:0;z-index:2;background:var(--collin-blue);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:3px solid var(--kraft);}
    .mobile-preview-head strong{font-family:var(--serif);font-size:1rem;}
    .mobile-preview-head button{background:#fff;color:var(--collin-blue);border:0;border-radius:6px;padding:8px 11px;font-weight:700;}
    .mobile-preview .paper{margin:14px 10px 0;padding:24px 20px;min-height:0;box-shadow:0 2px 12px rgba(30,42,61,.16);font-size:9.7pt;}
    .mobile-preview .r-name{font-size:17pt;}
    .mobile-preview .r-h{font-size:11.5pt;}
    body.preview-open{overflow:hidden;}
  }

  @page{size:letter;margin:0.75in;}
  @media print{
    header.top,.rail,.form-col,.preview-label,.save-status{display:none !important;}
    .app{display:block;}
    .preview-col{background:#fff;padding:0;border:none;}
    .paper{box-shadow:none;padding:0;min-height:0;}
  }

.align-input-preview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;background:#fff;padding:12px;font:inherit;font-size:.85rem;}
.align-confirm{display:flex;align-items:flex-start;gap:10px;font-weight:normal;line-height:1.5;margin:14px 0;}
.align-confirm input{width:auto;flex:0 0 auto;margin-top:5px;}
.align-finding p{font-size:.87rem;line-height:1.5;overflow-wrap:anywhere;}
#alignmentReport h4{color:var(--collin-blue);margin-top:20px;}
#jobUrl{margin-bottom:10px;}
@media(max-width:760px){#alignmentReport .btn,.ai-polish>.btn{width:100%;} .align-confirm{font-size:.9rem;}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    
    <div class="title-block">
      <h1>Resume Builder &amp; Job-Match Coach</h1>
      <p id="collegeTag">BUILD YOUR RESUME · KEEP YOUR OWN VOICE</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-ghost btn-small" onclick="document.getElementById('loadFileInput').click()">Load saved file</button>
    <input type="file" id="loadFileInput" accept="application/json" onchange="loadProgressFile(this)">
    <button class="btn btn-ghost btn-small" onclick="saveProgressFile()">Save backup file</button>
    <button class="btn btn-outline btn-small" onclick="printResume()">Print / Save PDF</button>
    <button class="btn btn-primary" onclick="downloadWord()">Download Word Resume</button>
  </div>
</header>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="form-col" id="formPanel"></main>
  <aside class="preview-col">
    <div class="preview-label">
      <span>Live preview</span>
      <span class="save-status" id="saveStatus">—</span>
    </div>
    <div class="paper" id="previewPanel"></div>
  </aside>
</div>

<div class="mobile-workflow-bar" id="mobileWorkflowBar" aria-label="Resume section navigation">
  <button type="button" class="btn btn-outline mobile-prev" id="mobilePrevBtn" onclick="mobileStep(-1)">← Previous</button>
  <button type="button" class="btn btn-outline mobile-preview-btn" onclick="openMobilePreview()">Preview</button>
  <button type="button" class="btn btn-primary mobile-next" id="mobileNextBtn" onclick="mobileStep(1)">Save &amp; Continue →</button>
</div>
<div class="mobile-preview" id="mobilePreview" role="dialog" aria-modal="true" aria-labelledby="mobilePreviewTitle">
  <div class="mobile-preview-head">
    <strong id="mobilePreviewTitle">Resume Preview</strong>
    <button type="button" onclick="closeMobilePreview()">Back to Editing</button>
  </div>
  <div class="paper" id="mobilePreviewPanel"></div>
</div>

<script>
/* =====================================================================
   DATA
   ===================================================================== */
const GUIDING = {
  summary: "General statement about who you are, your relevant experience, and the goal of your search. 1–4 sentences. Avoid first-person language (I, me, my, mine) — write it the way it will read on the page.",
  coreSkills: "Foundational, teachable abilities that are relevant to the job you want (e.g., Data Entry, Spanish Fluency, Adobe Photoshop).",
  keyStrengths: "Qualities that influence HOW you work (e.g., Empathetic Communicator, Analytical Thinker, Calm Under Pressure).",
  competencies: "Higher-level abilities that blend skill + experience + judgment (e.g., Data-Driven Decision Support, Cross-Team Coordination).",
  expBullets: "One line per bullet. Mix: (1) specific tasks/responsibilities, (2) accomplishments — quantify if you can (numbers, %, $, time), and (3) any above-and-beyond moments.",
  eduFocus: "The specific focus of your program, relevant coursework, or honors — one short line is plenty.",
  projectDescription: "One or two sentences on what the project was and why it mattered — the context a reader needs before the bullets.",
  projectBullets: "3–5 bullets. Emphasize actions you took and measurable results (numbers, %, scope, audience reached) rather than just a task list.",
  leadBullets: "One line per bullet: what you accomplished, contributed, or the honor you received.",
  additional: "Only include what's not already covered above. If a technical skill or certification is directly relevant to the job you want, it usually belongs in Summary or Education instead."
};

const WEAK_STARTERS = ["responsible for","in charge of","duties included","worked on","helped with","assisted with","involved in","tasked with","was in charge of","did work on"];

const AI_CLICHES = ["spearheaded","leverage","leveraged","leveraging","synergy","synergies","utilize","utilizing","utilized","in order to","passionate about","results-driven","results driven","dynamic team player","proven track record","seamlessly","robust solution","cutting-edge","game-changer","game changer","ensure smooth","dive into","delve into","furthermore","moreover","holistic approach","paradigm shift","unlock","elevate","elevating","empower","empowering","foster","fostering","streamline","streamlined solution","bespoke","tailored solution","world-class","best-in-class","strategic vision","thought leader","circle back","touch base","low-hanging fruit"];

const STRONG_VERBS = {
  "Leadership": ["Led","Directed","Coordinated","Organized","Mentored","Trained","Supervised"],
  "Communication": ["Presented","Facilitated","Authored","Negotiated","Advised","Communicated"],
  "Analysis": ["Analyzed","Evaluated","Assessed","Diagnosed","Researched","Audited"],
  "Operations": ["Streamlined","Implemented","Executed","Managed","Maintained","Processed"],
  "Creative": ["Designed","Developed","Produced","Created","Launched","Drafted"],
  "Technical": ["Built","Programmed","Configured","Automated","Engineered","Repaired"]
};

const CLICHE_SWAP = {
  "spearheaded":"led","spearheading":"leading","spearhead":"lead",
  "leverage":"use","leverages":"uses","leveraged":"used","leveraging":"using",
  "utilize":"use","utilizes":"uses","utilizing":"using","utilized":"used",
  "passionate about":"focused on","results-driven":"reliable and outcome-focused","results driven":"reliable and outcome-focused",
  "dynamic team player":"collaborative team member","proven track record":"consistent record",
  "seamlessly":"smoothly","seamless":"smooth","cutting-edge":"current","game-changer":"major improvement","game changer":"major improvement",
  "streamlined solution":"simplified approach","streamline":"simplify","streamlines":"simplifies","streamlined":"simplified",
  "holistic approach":"complete approach","unlock":"support","unlocks":"supports","elevate":"improve","elevates":"improves","elevating":"improving",
  "empower":"support","empowers":"supports","empowering":"supporting","foster":"build","fosters":"builds","fostering":"building",
  "bespoke":"custom","tailored solution":"custom approach","world-class":"high-quality","best-in-class":"top-tier",
  "strategic vision":"clear plan","thought leader":"experienced voice","in order to":"to","robust solution":"strong approach"
};
function swapCliches(text){
  let out = text;
  Object.keys(CLICHE_SWAP).sort((a,b)=>b.length-a.length).forEach(k=>{
    const re = new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi");
    out = out.replace(re, CLICHE_SWAP[k]);
  });
  return out;
}
function stripFirstPersonSentence(sentence){
  let out = (sentence||"").trim();
  out = out.replace(/^i\s*'?m\s+an?\s+/i, "");
  out = out.replace(/^i\s+am\s+an?\s+/i, "");
  out = out.replace(/^i\s+am\s+looking\s+for\s+/i, "seeking ");
  out = out.replace(/^i\s+am\s+interested\s+in\s+/i, "seeking ");
  out = out.replace(/^i\s+am\s+(hoping|aiming)\s+to\s+/i, "$1 to ");
  out = out.replace(/^i\s+am\s+/i, "");
  out = out.replace(/^i\s+(have|possess)\s+/i, "");
  out = out.replace(/^i\s+/i, "");
  out = out.replace(/\bi've\b/gi, "have");
  out = out.replace(/\bi'm\b/gi, "am");
  out = out.replace(/\bmy\s+/gi, "");
  out = out.replace(/\s{2,}/g," ").trim();
  if(out.length) out = out.charAt(0).toUpperCase() + out.slice(1);
  return out;
}
function stripFirstPerson(text){
  const parts = splitSentences(text||"");
  if(parts.length === 0) return "";
  return parts.map(stripFirstPersonSentence).join(" ");
}
function joinNatural(arr){
  if(arr.length === 0) return "";
  if(arr.length === 1) return arr[0];
  if(arr.length === 2) return arr[0] + " and " + arr[1];
  return arr.slice(0,-1).join(", ") + ", and " + arr[arr.length-1];
}
function trimToSentences(text, max){
  const parts = splitSentences(text);
  return parts.slice(0, max).join(" ").trim();
}
function cleanPass(text){
  let out = stripFirstPerson(text);
  out = swapCliches(out);
  out = trimToSentences(out, 4);
  return out;
}
function firstItems(csv, n){
  if(!csv) return [];
  return csv.split(",").map(s=>s.trim()).filter(Boolean).slice(0, n);
}
function detectGoalClause(text){
  const m = text.match(/([^.!?]*\b(seeking|looking for|interested in|hoping to|aiming to|goal is to)\b[^.!?]*[.!?]?)/i);
  return m ? m[1].trim() : null;
}
function detectJobTitle(jobText){
  if(!jobText || !jobText.trim()) return null;
  let m = jobText.match(/\b(?:job title|position|role|title)\s*[:\-]\s*([A-Z][A-Za-z&/ ]{2,40})/);
  if(m) return m[1].trim().replace(/\s+/g," ");
  const kws = extractKeywords(jobText.split(/\n/).slice(0,3).join(" "));
  const multiWord = kws.find(k => k.term.split(" ").length >= 2 && /^[A-Z]/.test(k.term));
  return multiWord ? multiWord.term : null;
}
function buildSummaryVariants(){
  const original = state.summary || "";
  if(!original.trim()) return null;
  const cleaned = cleanPass(original);
  const goalClause = detectGoalClause(original);
  const remainder = goalClause ? cleanPass(original.replace(goalClause, "").trim()) : "";
  const strengths = firstItems(state.keyStrengths, 2).concat(firstItems(state.competencies, 1));
  const skills = firstItems(state.coreSkills, 3);

  const variants = [{label:"Cleaned", text: cleaned}];

  if(goalClause && remainder){
    let g = cleanPass(goalClause);
    g = g.charAt(0).toLowerCase() + g.slice(1);
    variants.push({label:"Goal-first", text: (remainder.replace(/[.]$/,"") + ", " + g).trim()});
  } else if(skills.length){
    variants.push({label:"Goal-first", text: (cleaned.replace(/[.]$/,"") + ", with skills in " + joinNatural(skills) + ".").trim()});
  }

  if(strengths.length){
    const lead = joinNatural(strengths) + "-focused professional";
    const rest = cleaned.replace(/^[A-Z]/, c=>c.toLowerCase());
    variants.push({label:"Strength-first", text: (lead + " — " + rest).trim()});
  } else {
    const sentences = splitSentences(original);
    if(sentences.length >= 2){
      const reordered = [sentences[1], sentences[0]].concat(sentences.slice(2)).join(" ");
      variants.push({label:"Reordered", text: cleanPass(reordered)});
    }
  }

  if(state.jobPosting && state.jobPosting.trim()){
    const jobTitle = detectJobTitle(state.jobPosting);
    const match = matchKeywords();
    const preferred = match.matched.filter(t => t.includes(" ") || /^[A-Z]/.test(t));
    const topMatched = (preferred.length ? preferred : match.matched).slice(0,3);
    const base = (remainder && goalClause) ? remainder : cleaned.replace(/[.]$/,"");
    const bits = [];
    if(topMatched.length) bits.push("with proven strength in " + joinNatural(topMatched));
    if(jobTitle) bits.push("seeking a " + jobTitle + " role");
    if(bits.length){
      variants.push({label:"Job-targeted", text: (base.replace(/[.]$/,"") + ", " + bits.join(", ") + ".").trim()});
    }
  }

  const seen = new Set();
  return variants.filter(v => {
    const key = v.text.toLowerCase();
    if(seen.has(key) || !v.text.trim()) return false;
    seen.add(key);
    return true;
  });
}

function formatPhoneNumber(value){

function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o===undefined||o===null)?o:o[k], obj); }
function setPath(obj, path, value){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(!(parts[i] in o) || typeof o[parts[i]] !== "object" || o[parts[i]]===null) o[parts[i]] = {};

  }

}

/* =====================================================================
   COACHING ANALYSIS (rule-based — nothing here is AI-generated text)
   ===================================================================== */
function analyzeSummary(text){
  const flags = [];
  if(!text || !text.trim()) return flags;
  if(/\b(i'm|i've|i|my|me|mine)\b/i.test(text)){
    flags.push({level:"amber", tag:"VOICE", msg:"Contains first-person language (I / my / me). The template calls for third-person, e.g. \"Customer-focused professional with...\" instead of \"I am a customer-focused professional...\""});
  }
  const sentenceCount = (text.match(/[.!?]+/g)||[]).length || (text.trim()?1:0);
  if(sentenceCount > 4){
    flags.push({level:"amber", tag:"LENGTH", msg:"Longer than the suggested 1–4 sentences. Consider trimming to the most relevant points."});
  }
  const lower = text.toLowerCase();
  const foundCliche = AI_CLICHES.find(c => lower.includes(c));
  if(foundCliche){
    flags.push({level:"red", tag:"PHRASING", msg:"Contains \""+foundCliche+"\" — a phrase that often reads as generic or AI-sounding. Try describing it plainly in your own words."});
  }
  if(flags.length===0){
    flags.push({level:"green", tag:"OK", msg:"Reads clearly and in third person."});
  }
  return flags;
}

function analyzeBulletLine(line){
  const flags = [];
  const lower = line.toLowerCase();
  const starter = WEAK_STARTERS.find(w => lower.startsWith(w));
  if(starter){
    const cats = Object.keys(STRONG_VERBS);
    const cat = cats[Math.floor(Math.random()*cats.length)];
    const verbs = STRONG_VERBS[cat].slice(0,3).join(", ");
    flags.push({level:"amber", tag:"VERB", msg:"Starts with a soft phrase (\""+starter+"\"). Try opening with a stronger verb like "+verbs+"."});
  }
  const foundCliche = AI_CLICHES.find(c => lower.includes(c));
  if(foundCliche){
    flags.push({level:"red", tag:"PHRASING", msg:"Contains \""+foundCliche+"\" — consider your own plainer wording instead."});
  }
  if(line.length > 35 && !/[\d%$]/.test(line)){
    flags.push({level:"amber", tag:"NUMBER", msg:"No number yet — if you can measure it (count, %, $, time saved), consider adding one."});
  }
  return flags;
}

function analyzeBulletsBlock(text){
  const ls = lines(text);
  const results = [];
  ls.forEach((line, i) => {
    const flags = analyzeBulletLine(line);
    flags.forEach(f => results.push(Object.assign({line:i+1}, f)));
  });
  return results;
}

function renderFlagList(flags, emptyMsg){
  if(!flags || flags.length===0){
    return '<div class="flag green"><b>OK</b>'+esc(emptyMsg||"No notes here.")+'</div>';
  }
  const capped = flags.slice(0,5);
  let html = capped.map(f => {
    const prefix = f.line ? ("Line "+f.line+" — ") : "";
    return '<div class="flag '+f.level+'"><b>'+f.tag+'</b>'+esc(prefix+f.msg)+'</div>';
  }).join("");
  if(flags.length > 5){
    html += '<div class="footer-note">+'+(flags.length-5)+' more note(s) below.</div>';
  }
  return html;
}

/* =====================================================================
   KEYWORD MATCHING
   ===================================================================== */
function extractKeywords(jobText){
  if(!jobText || !jobText.trim()) return [];
  const capPhrases = {};
  const capRegex = /\b([A-Z][a-zA-Z+#]*(?:\s+[A-Z][a-zA-Z+#]*){0,2})\b/g;
  let m;
  while((m = capRegex.exec(jobText)) !== null){
    const phrase = m[1].trim();
    if(phrase.split(" ").length > 3) continue;
    const lowerWords = phrase.toLowerCase().split(" ");
    if(lowerWords.every(w => STOPWORDS.has(w))) continue;
    if(phrase.length < 3) continue;
    capPhrases[phrase] = (capPhrases[phrase]||0) + 1;
  }
  const words = jobText.toLowerCase().replace(/[^a-z0-9+#\s]/g," ").split(/\s+/).filter(Boolean);
  const freq = {};
  words.forEach(w => {
    if(w.length < 4 || STOPWORDS.has(w) || /^\d+$/.test(w)) return;
    freq[w] = (freq[w]||0) + 1;
  });
  const combined = {};
  Object.keys(capPhrases).forEach(k => combined[k] = (combined[k]||0) + capPhrases[k]*2);
  Object.keys(freq).forEach(k => combined[k] = (combined[k]||0) + freq[k]);
  return Object.entries(combined)
    .sort((a,b)=> b[1]-a[1])
    .slice(0, 24)
    .map(([term,count]) => ({term,count}));
}

function buildResumeText(){
  const parts = [state.summary, state.coreSkills, state.keyStrengths, state.competencies,
    state.additional.technical, state.additional.other, state.additional.quals, state.additional.interests];
  state.experienceOrder.forEach(id => { const e=state.experience[id]; parts.push(e.title, e.employer, e.bullets); });
  state.educationOrder.forEach(id => { const e=state.education[id]; parts.push(e.degree, e.institution, e.focus); });
  state.projectsOrder.forEach(id => { const p=state.projects[id]; parts.push(p.title, p.org, p.role, p.description, p.bullets); });
  state.leadershipOrder.forEach(id => { const e=state.leadership[id]; parts.push(e.role, e.org, e.bullets); });
  return parts.join(" ").toLowerCase();
}

function matchKeywords(){
  const kws = extractKeywords(state.jobPosting);
  const resumeText = buildResumeText();
  const matched = [], missing = [];
  kws.forEach(k => {
    if(resumeText.includes(k.term.toLowerCase())) matched.push(k.term);
    else missing.push(k.term);
  });
  return {matched: matched.slice(0,16), missing: missing.slice(0,16)};
}

const PRINTABLE_PAGE_HEIGHT = 9.5 * 96;
function measureResume(layout){
  const probe=document.createElement('div');
  probe.className='paper layout-'+layout+' resume-measure';
  probe.innerHTML=buildResumeInnerHTML();
  document.body.appendChild(probe);
  const height=probe.scrollHeight;
  probe.remove();
  return height;
}
function getEffectiveLayout(){
  if(state.layoutMode && state.layoutMode!=="auto") return state.layoutMode;
  if(measureResume("spacious") <= PRINTABLE_PAGE_HEIGHT * 0.96) return "spacious";
  if(measureResume("standard") <= PRINTABLE_PAGE_HEIGHT) return "standard";
  return "compact";
}
function layoutStatusText(layout){
  const pages=Math.max(1,Math.ceil(measureResume(layout)/PRINTABLE_PAGE_HEIGHT));
  if(state.layoutMode==="auto"){
    if(layout==="spacious") return "Auto-fit selected Spacious spacing because the resume has room on one page.";
    if(layout==="standard") return "Auto-fit selected Standard spacing to keep the resume near one page.";
    if(pages===1) return "Auto-fit selected Compact spacing to keep the resume on one page.";
    return "Auto-fit selected Compact spacing. The content needs about "+pages+" pages at a readable font size.";
  }
  return LAYOUTS[layout].label+" spacing is selected"+(pages>1?"; the content needs about "+pages+" pages.":" and fits on about one page.");
}
function setLayoutMode(value){ state.layoutMode=value; persist(); renderAll(); }
function renderLayoutControls(){
  const layout=getEffectiveLayout();
  return '<div class="review-block"><h3>Page layout</h3>'

    +'<option value="auto"'+(state.layoutMode==='auto'?' selected':'')+'>Auto-fit (recommended)</option>'
    +'<option value="spacious"'+(state.layoutMode==='spacious'?' selected':'')+'>Spacious</option>'

    +'<p class="footer-note">'+esc(layoutStatusText(layout))+' Font sizes stay unchanged. Word may paginate slightly differently, so check the downloaded file.</p></div>';

function buildWordDocument(){
  const layout=getEffectiveLayout();
  const d=LAYOUTS[layout];
  const inner = buildResumeInnerHTML()
    .replace(/class="r-name"/g,'style="text-align:center;font-size:19pt;font-weight:bold;margin:0 0 2px 0;font-family:Aptos,Arial,sans-serif;"')
    .replace(/class="r-contact"/g,'style="text-align:center;font-size:10pt;margin:0 0 '+d.contact+'px 0;font-family:Aptos,Arial,sans-serif;"')
    .replace(/class="r-h-table"/g,'style="width:100%;border-collapse:collapse;margin:'+d.headingTop+'px 0 '+d.headingBottom+'px 0;" cellpadding="0" cellspacing="0"')
    .replace(/class="r-h"/g,'style="font-weight:bold;font-size:12.5pt;letter-spacing:0.5pt;border-bottom:1.4pt solid #111111;padding-bottom:2px;text-align:left;font-family:Aptos,Arial,sans-serif;"')
    .replace(/class="r-row-table"/g,'style="width:100%;border-collapse:collapse;margin-top:'+d.rowTop+'px;font-size:10.5pt;font-family:Aptos,Arial,sans-serif;" cellpadding="0" cellspacing="0"')
    .replace(/class="r-right"/g,'style="text-align:right;white-space:nowrap;padding-left:12px;" align="right"')
    .replace(/class="r-title"/g,'style="font-style:italic;font-size:10.5pt;margin:1px 0 '+d.titleBottom+'px 0;font-family:Aptos,Arial,sans-serif;"')
    .replace(/class="r-ul"/g,'style="margin:'+d.listTop+'px 0 '+d.listBottom+'px 0;padding-left:18px;font-size:10.5pt;line-height:'+d.lineHeight+';font-family:Aptos,Arial,sans-serif;"')
    .replace(/<li>/g,'<li style="margin-bottom:'+d.itemBottom+'px;">')
    .replace(/class="r-p"/g,'style="margin:0 0 '+d.pBottom+'px 0;font-size:10.5pt;line-height:'+d.lineHeight+';font-family:Aptos,Arial,sans-serif;"')
    .replace(/class="r-proj-title"/g,'style="font-weight:bold;font-size:10.5pt;margin:'+d.projectTop+'px 0 0 0;font-family:Aptos,Arial,sans-serif;"')
    .replace(/r-empty/g,"");
  return "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"
    + "<head><meta charset='utf-8'><title>Resume</title>"
    + "<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->"
    + "<style>@page{size:8.5in 11in;margin:0.75in;} body{font-family:Aptos,Arial,sans-serif;line-height:"+d.lineHeight+";}</style>"
    + "</head><body>" + inner + "</body></html>";
}

  window.print();

function downloadWord(){
  const doc = buildWordDocument();
  const blob = new Blob(['\ufeff', doc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const nm = (state.contact.name || "resume").trim().replace(/\s+/g,'_') || "resume";
  a.download = nm + "_Resume.doc";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  setTimeout(()=>{ alert("Your resume downloaded as a .doc file. Open it in Word (or upload it to Google Docs), then use \"Save As\" and choose .docx to convert it to the standard format you can keep editing."); }, 200);
}

const TABS = [
  {id:"contact", label:"Contact Info", required:true},
  {id:"summary", label:"Summary & Skills", required:true},

  {id:"education", label:"Education", required:true},
  {id:"projects", label:"Projects", required:false},

function isTabComplete(id){
  switch(id){
    case "contact": return !!(state.contact.name && state.contact.email);
    case "summary": return !!state.summary.trim();
    case "experience": return state.experienceOrder.some(i=>state.experience[i].employer && state.experience[i].title);
    case "education": return state.educationOrder.some(i=>state.education[i].institution);
    case "projects": return state.projectsOrder.some(i=>state.projects[i].title);
    case "leadership": return state.leadershipOrder.some(i=>state.leadership[i].org);
    case "additional": {const a=state.additional; return !!(a.technical||a.other||a.quals||a.interests);}
    case "job": return !!state.jobPosting.trim();
    default: return false;
  }
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = TABS.map(t => {
    const complete = isTabComplete(t.id);
    const active = state.activeTab === t.id;
    return '<button type="button" class="tab '+(complete?'complete':'')+' '+(active?'active':'')+'" onclick="switchTab(\''+t.id+'\')">'
      + '<span class="dot"></span><span>'+t.label+'</span>'
      + (t.required ? '' : '<span class="opt">optional</span>')
      + '</button>';
  }).join("");
}

function switchTab(id){
  state.activeTab = id;
  renderAll();
  if(window.matchMedia('(max-width:1080px)').matches){
    requestAnimationFrame(scrollActiveMobileTabIntoView);
  }
  if(window.matchMedia('(max-width:760px)').matches){
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function scrollActiveMobileTabIntoView(){
  if(!window.matchMedia('(max-width:1080px)').matches) return;
  const rail=document.getElementById('rail');
  const active=rail&&rail.querySelector('.tab.active');
  if(!rail||!active) return;
  const left=active.offsetLeft-Math.max(12,(rail.clientWidth-active.offsetWidth)/2);
  rail.scrollTo({left:Math.max(0,left),behavior:'smooth'});
}
function mobileStep(delta){
  const idx=TABS.findIndex(t=>t.id===state.activeTab);
  const next=Math.max(0,Math.min(TABS.length-1,idx+delta));
  if(next===idx) return;
  state.activeTab=TABS[next].id;
  persist();
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
  requestAnimationFrame(scrollActiveMobileTabIntoView);
}
function updateMobileWorkflow(){
  const idx=TABS.findIndex(t=>t.id===state.activeTab);
  const prev=document.getElementById('mobilePrevBtn');
  const next=document.getElementById('mobileNextBtn');
  if(!prev||!next) return;
  prev.disabled=idx<=0;
  next.disabled=idx>=TABS.length-1;
  prev.textContent=idx>0?'← '+TABS[idx-1].label:'← Previous';
  next.textContent=idx<TABS.length-1?'Save & Continue →':'Complete';
}
function openMobilePreview(){
  const modal=document.getElementById('mobilePreview');
  const panel=document.getElementById('mobilePreviewPanel');
  if(!modal||!panel) return;
  panel.innerHTML=buildResumeInnerHTML();
  modal.classList.add('open');
  document.body.classList.add('preview-open');
  modal.scrollTop=0;
}
function closeMobilePreview(){
  const modal=document.getElementById('mobilePreview');
  if(modal) modal.classList.remove('open');
  document.body.classList.remove('preview-open');
}

function showSummaryPolish(panelId){

  const panel = document.getElementById(panelId);

  }
  const variants = buildSummaryVariants();
  window.__summaryVariants = variants;
  renderSummaryPolishPanel(variants, panelId);

function renderSummaryPolishPanel(variants, panelId){
  panelId = panelId || 'summaryPolishPanel';
  const panel = document.getElementById(panelId);
  if(!variants || variants.length===0){
    panel.innerHTML = '<p class="hint" style="margin-top:8px;">Nothing to reshape yet — your draft already looks straightforward.</p>';
    return;
  }
  let html = '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">';
  html += '<p class="footer-note" style="margin-bottom:10px;">Built entirely from your own words (plus the skills you\'ve already listed, and — if you\'ve pasted one — the target job posting) — nothing here is AI-generated. Treat these as starting points; adjust the grammar to taste.</p>';
  variants.forEach((v, i) => {
    const flags = analyzeSummary(v.text);
    html += '<div class="entry-card" style="background:#fff;">'
      + '<div class="entry-head"><span class="entry-num">'+esc(v.label.toUpperCase())+'</span>'
      + '<button type="button" class="btn btn-primary btn-small" onclick="useSummaryVariant('+i+')">Use this version</button></div>'
      + '<p style="font-size:0.92rem;line-height:1.5;margin:0 0 8px 0;">'+esc(v.text)+'</p>'
      + '<div class="coach-feedback">'+renderFlagList(flags, "Reads clearly.")+'</div>'
      + '</div>';
  });
  html += '</div>';
  panel.innerHTML = html;
}
function useSummaryVariant(i){
  const variants = window.__summaryVariants;
  if(!variants || !variants[i]) return;
  state.summary = variants[i].text;
  persist();
  renderFormPanel();
  renderPreview();
  renderRail();
}

let aiSummaryText = "";
function aiJobTerms(){
  if(!state.jobPosting || !state.jobPosting.trim()) return [];
  return extractKeywords(state.jobPosting).slice(0,12).map(k=>k.term);
}
async function polishSummaryWithAI(){
  const btn=document.getElementById('summaryAiBtn');
  const status=document.getElementById('summaryAiStatus');
  const result=document.getElementById('summaryAiResult');
  const output=document.getElementById('summaryAiOutput');
  const text=(state.summary||'').trim();
  if(!text){ status.textContent='Write a draft Professional Summary first, then choose “Polish with AI.”'; return; }
  btn.disabled=true; btn.textContent='Polishing…'; result.classList.remove('show');
  status.textContent='Polishing your wording while preserving your facts, qualifications, and level of certainty…';
  try{
    const response=await fetch(AI_POLISH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'resume-summary',text,terms:aiJobTerms()})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||('AI request failed ('+response.status+').'));
    aiSummaryText=String(data.polished||'').trim();
    if(!aiSummaryText) throw new Error('The AI did not return a usable summary.');
    output.textContent=aiSummaryText; result.classList.add('show');
    status.textContent='Review the polished version. You decide whether to use it.';
  }catch(err){
    console.error('AI summary polish error:',err);
    status.textContent='AI polishing is temporarily unavailable. Your original summary and local tools are unchanged.';
  }finally{ btn.disabled=false; btn.textContent='Polish with AI'; }
}
function useAISummary(){
  if(!aiSummaryText) return;
  state.summary=aiSummaryText; persist(); renderFormPanel(); renderPreview(); renderRail();
}
function dismissAISummary(){
  aiSummaryText='';
  const result=document.getElementById('summaryAiResult'); if(result) result.classList.remove('show');
  const status=document.getElementById('summaryAiStatus'); if(status) status.textContent='Kept your original summary. No AI changes were applied.';
}

function renderAdditionalTab(){
  const a = state.additional;
  return '<div class="section-head"><h2>Additional Information</h2><div class="guide">'+GUIDING.additional+'</div></div>'
    + '<label for="add-tech">Technical Skills</label>'
    + '<textarea id="add-tech" data-path="additional.technical" rows="2" placeholder="Microsoft Excel, POS systems, basic HTML">'+esc(a.technical)+'</textarea>'
    + '<label for="add-other">Other Skills</label>'
    + '<textarea id="add-other" data-path="additional.other" rows="2" placeholder="Project planning, attention to detail">'+esc(a.other)+'</textarea>'
    + '<label for="add-quals">Other Qualifications</label>'
    + '<textarea id="add-quals" data-path="additional.quals" rows="2" placeholder="CPR Certified, Food Handler\'s License">'+esc(a.quals)+'</textarea>'

    + '<textarea id="add-interests" data-path="additional.interests" rows="2" placeholder="Community theater, youth soccer coaching">'+esc(a.interests)+'</textarea>';
}

function renderJobTab(){ return renderAlignmentJobTab(); }

function renderJobMatch(r){
  if(!state.jobPosting.trim()) return '<p class="hint">Paste a job posting above to see a keyword comparison.</p>';
  let html = '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>Already in your resume:</b></p>';
  html += '<div class="tags-row">' + (r.matched.length? r.matched.map(t=>'<span class="chip matched">'+esc(t)+'</span>').join(""): '<span class="hint">No overlap found yet.</span>') + '</div>';
  html += '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>Shows up in the posting, not yet in your resume:</b></p>';
  html += '<div class="tags-row">' + (r.missing.length? r.missing.map(t=>'<span class="chip missing">'+esc(t)+'</span>').join(""): '<span class="hint">Nothing obvious missing.</span>') + '</div>';
  html += '<p class="footer-note">Only add a term to your resume if it\'s honestly true of your experience — don\'t add a skill you don\'t have just to match the posting.</p>';
  return html;
}

function collectAllFlags(){
  const totals = {red:0, amber:0};
  const tally = (flags)=>{ flags.forEach(f=>{ if(f.level==="red") totals.red++; else if(f.level==="amber") totals.amber++; }); };
  tally(analyzeSummary(state.summary));
  state.experienceOrder.forEach(id => tally(analyzeBulletsBlock(state.experience[id].bullets)));
  state.projectsOrder.forEach(id => tally(analyzeBulletsBlock(state.projects[id].bullets)));
  state.leadershipOrder.forEach(id => tally(analyzeBulletsBlock(state.leadership[id].bullets)));
  return totals;
}

function renderReviewTab(){
  const totals = collectAllFlags();
  const r = matchKeywords();
  let html = '<div class="section-head"><h2>Review &amp; Export</h2></div>';

  html += '<div class="review-block"><h3>Language check</h3>';
  html += '<span class="count-pill">🟠 '+totals.amber+' phrasing/quantify note(s)</span>';
  html += '<span class="count-pill">🔴 '+totals.red+' possible AI-sounding phrase(s)</span>';
  html += '<p class="footer-note">Head back to Summary, Experience, or Leadership to see the specific lines.</p></div>';

  html += '<div class="review-block"><h3>Job-match keywords</h3>';
  if(state.jobPosting.trim()){
    html += '<div class="tags-row">'+ r.matched.slice(0,10).map(t=>'<span class="chip matched">'+esc(t)+'</span>').join("") +'</div>';
    html += '<p class="footer-note">'+r.missing.length+' term(s) from the posting aren\'t reflected yet — see the Target Job tab.</p>';
  } else {
    html += '<p class="hint">Add a job posting on the Target Job tab to see a match report.</p>';
  }
  html += '</div>';

  html += '<div class="review-block"><h3>Build your final summary</h3>'
    + '<p class="footer-note" style="margin-bottom:8px;">Now that your experience and (optionally) a target job posting are in, see refined summary options built from all of it.</p>'
    + '<button type="button" class="btn btn-outline btn-small" onclick="showSummaryPolish(\'reviewSummaryPolishPanel\')">Polish my summary</button>'
    + '<div id="reviewSummaryPolishPanel"></div>'
    + '</div>';

  html += renderLayoutControls();

  html += '<div class="review-block"><h3>Export</h3>'
    + '<button class="btn btn-primary" onclick="downloadWord()">Download Word Resume (.doc)</button> '
    + '<button class="btn btn-outline" onclick="printResume()">Print / Save as PDF</button>'
    + '<p class="footer-note">The Word file opens directly in Microsoft Word or Google Docs. In Word, use "Save As" → .docx to convert it to the standard editable format.</p>'
    + '<p class="footer-note">For PDF: choose Save as PDF, open More settings, turn off Headers and footers, and leave Margins at Default. The tool requests 0.75-inch margins; check the print preview before saving.</p>'
    + '</div>';

  html += '<div class="review-block"><h3>Your data</h3>'
    + '<button class="btn btn-outline btn-small" onclick="saveProgressFile()">Save a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="document.getElementById(\'loadFileInput\').click()">Load a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="clearData()" style="color:var(--red);border-color:var(--red);">Clear my data</button>'
    + '<p class="footer-note">Your resume data stays in your browser unless you choose an AI feature. “Polish with AI” sends the Professional Summary and a short list of job terms. “Run AI Alignment Review” sends your resume content (excluding Contact fields) and the job description to Cloudflare Workers AI. Identifying details typed outside Contact fields may remain. URL retrieval sends only the job URL. No AI feature changes your resume automatically. On a shared or lab computer, save a backup file so you can pick this up later.</p>'
    + '</div>';

  return html;
}

/* =====================================================================
   ENTRY ADD/REMOVE
   ===================================================================== */
function addEntry(kind){
  const id = genId(kind[0]);
  if(kind==="experience"){ state.experience[id] = freshExperience(); state.experienceOrder.push(id); }
  if(kind==="education"){ state.education[id] = freshEducation(); state.educationOrder.push(id); }
  if(kind==="projects"){ state.projects[id] = freshProject(); state.projectsOrder.push(id); }
  if(kind==="leadership"){ state.leadership[id] = freshLeadership(); state.leadershipOrder.push(id); }
  persist(); renderAll();
}
function removeEntry(kind, id){
  if(kind==="experience"){ delete state.experience[id]; state.experienceOrder = state.experienceOrder.filter(x=>x!==id); }
  if(kind==="education"){ delete state.education[id]; state.educationOrder = state.educationOrder.filter(x=>x!==id); }
  if(kind==="projects"){ delete state.projects[id]; state.projectsOrder = state.projectsOrder.filter(x=>x!==id); }
  if(kind==="leadership"){ delete state.leadership[id]; state.leadershipOrder = state.leadershipOrder.filter(x=>x!==id); }
  persist(); renderAll();
}

/* =====================================================================
   MAIN RENDER
   ===================================================================== */
function renderFormPanel(){
  const panel = document.getElementById('formPanel');
  switch(state.activeTab){
    case "contact": panel.innerHTML = renderContactTab(); break;
    case "summary": panel.innerHTML = renderSummaryTab(); break;
    case "experience": panel.innerHTML = renderExperienceTab(); break;
    case "education": panel.innerHTML = renderEducationTab(); break;
    case "projects": panel.innerHTML = renderProjectsTab(); break;
    case "leadership": panel.innerHTML = renderLeadershipTab(); break;
    case "additional": panel.innerHTML = renderAdditionalTab(); break;
    case "job": panel.innerHTML = renderJobTab(); break;
    case "review": panel.innerHTML = renderReviewTab(); break;
  }
  // populate coaching feedback for any coachable fields present
  panel.querySelectorAll('[data-coach]').forEach(el => updateCoachFeedback(el));
}

function updateCoachFeedback(el){
  const kind = el.getAttribute('data-coach');
  if(kind === "job"){
    const area = document.getElementById('jobMatchArea');
    if(area) area.innerHTML = renderJobMatch(matchKeywords());
    return;
  }
  const fb = document.getElementById(el.id + "-feedback");
  if(!fb) return;
  if(kind === "summary"){
    fb.innerHTML = renderFlagList(analyzeSummary(el.value), "Reads clearly.");
  } else if(kind === "bullets"){
    fb.innerHTML = renderFlagList(analyzeBulletsBlock(el.value), "Looks solid.");
  }
}

function renderAll(){
  renderRail();
  renderFormPanel();
  renderPreview();
  updateMobileWorkflow();
  document.title = state.contact.name ? (state.contact.name + " — Resume") : "Resume Builder & Job-Match Coach";
}

document.addEventListener('input', function(e){
  const path = e.target.getAttribute('data-path');
  if(!path) return;
  setPath(state, path, e.target.value);
  persist();
  renderPreview();
  renderRail();
  if(path === "contact.name") document.title = e.target.value ? (e.target.value + " — Resume") : "Resume Builder & Job-Match Coach";
  if(e.target.hasAttribute('data-coach')) updateCoachFeedback(e.target);
});

document.addEventListener('blur', function(e){
  if(e.target.getAttribute('data-path')!=="contact.phone") return;
  const formatted=formatPhoneNumber(e.target.value);
  e.target.value=formatted;
  state.contact.phone=formatted;
  persist();
  renderPreview();
  renderRail();
}, true);

document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeMobilePreview();
});
window.addEventListener('resize', function(){
  if(!window.matchMedia('(max-width:760px)').matches) closeMobilePreview();
  updateMobileWorkflow();
});

/* Optional Resume Alignment Review — no function here writes resume fields. */
const alignment={url:'',confirmedJob:'',report:null,snapshot:'',busy:false,message:'',retrievalMessage:''};
function alignmentResume(){
  const parts=[];
  const add=(label,value)=>{if(value && String(value).trim())parts.push(label+': '+String(value).trim());};
  add('Professional summary',state.summary);add('Core skills',state.coreSkills);add('Key strengths',state.keyStrengths);add('Professional competencies',state.competencies);
  for(const kind of ['experience','education','projects','leadership']){
    for(const id of state[kind+'Order']){parts.push('\n'+kind.toUpperCase());for(const [k,v] of Object.entries(state[kind][id]))add(k,v);}
  }
  for(const [k,v] of Object.entries(state.additional))add(k,v);
  return parts.join('\n');
}
function alignmentSnapshot(){return JSON.stringify([alignmentResume(),state.jobPosting]);}
function alignmentInvalidate(){
  if(alignment.report && alignment.snapshot!==alignmentSnapshot()){alignment.report=null;alignment.message='Your resume or posting changed. Run a new review for an up-to-date report.';}
  if(alignment.confirmedJob!==state.jobPosting){alignment.confirmedJob='';const cb=document.getElementById('alignConfirm');if(cb)cb.checked=false;}
  const box=document.getElementById('alignmentReport');if(box)box.innerHTML=alignmentReportHTML();
  const status=document.getElementById('alignStatus');if(status)status.textContent=alignment.message;
  const retrievalStatus=document.getElementById('retrievalStatus');if(retrievalStatus)retrievalStatus.textContent=alignment.retrievalMessage;
}
function alignmentReportHTML(){
  const report=alignment.report;
  if(!report || alignment.snapshot!==alignmentSnapshot())return '';
  const labels={match:'Clear matches',related:'Related wording / partial evidence',not_demonstrated:'Not demonstrated in this resume'};
  let html='<h3>Resume Alignment Review</h3><p class="hint">Generated '+esc(new Date(report.generatedAt).toLocaleString())+'. This is an advisory review, not an ATS score or hiring prediction. Findings are not exhaustive; check every conclusion.</p>';
  if(report.omitted)html+='<p class="flag amber">'+Number(report.omitted)+' finding(s) were omitted because their supporting text could not be verified. This report is partial.</p>';
  for(const [category,label] of Object.entries(labels)){
    const rows=report.findings.filter(f=>f.category===category);
    html+='<h4>'+label+' ('+rows.length+')</h4>';
    if(!rows.length)html+='<p class="hint">No verified findings returned in this category. This does not establish that there are none.</p>';
    for(const f of rows){html+='<article class="entry-card align-finding"><b>'+esc(f.requirement)+'</b><p class="hint">Posting priority: '+esc(f.priority)+'</p><p><strong>Job posting:</strong> “'+esc(f.jobEvidence)+'”</p>';
      html+=f.resumeEvidence?'<p><strong>Your resume:</strong> “'+esc(f.resumeEvidence)+'”</p>':'<p><strong>Your resume:</strong> No supporting evidence identified by this review. This does not mean you lack the skill.</p>';
      html+='<p><strong>Keyword to review:</strong> '+esc(f.keyword)+'</p><p><strong>Suggested action:</strong> '+esc(f.recommendation)+'</p><p class="hint">'+(category==='not_demonstrated'?'Add this term or supporting evidence only if it accurately describes your qualifications.':'Supporting text was located in your resume; confirm it supports the full requirement before changing terminology.')+'</p></article>';
    }
  }
  return html+'<button type="button" class="btn btn-outline" onclick="downloadAlignmentReport()">Download report (.txt)</button><p class="hint">Your resume has not been changed. This report is not included in your resume export.</p>';
}
function renderAlignmentJobTab(){
  return '<div class="section-head"><h2>Target Job &amp; Resume Alignment</h2><div class="guide">Bring in a job posting, then review how your resume supports its requirements. Nothing is added to your resume automatically.</div></div>'
  +'<label for="jobUrl">Job posting URL (optional)</label><input id="jobUrl" type="url" placeholder="https://…" value="'+esc(alignment.url)+'" oninput="alignment.url=this.value" maxlength="2048">'
  +'<button type="button" class="btn btn-outline" '+(alignment.busy?'disabled':'')+' onclick="retrieveAlignmentJob()">Retrieve Job Posting</button><p id="retrievalStatus" role="status" aria-live="polite">'+esc(alignment.retrievalMessage)+'</p><p class="hint">Public postings only. Some sites block access or require sign-in. If retrieval is unavailable, paste the job description below. Retrieval sends the URL, not your resume.</p>'
  +'<label for="jobText">Job posting text — review or paste here</label><textarea id="jobText" data-path="jobPosting" data-coach="job" rows="10" placeholder="Paste the full job description here…">'+esc(state.jobPosting)+'</textarea>'
  +'<section class="ai-polish" aria-label="Optional AI alignment review"><h3>Resume Alignment Review <span class="hint">(optional AI)</span></h3><p>Find clear matches, related wording, requirements not demonstrated, and keywords to consider.</p>'
  +'<details><summary>Review the resume content that will be sent</summary><pre class="align-input-preview">'+esc(alignmentResume())+'</pre></details>'
  +'<p class="hint">Choosing Run AI Alignment Review sends the resume content shown above and this job description to Cloudflare Workers AI. Contact fields are excluded; identifying details you typed elsewhere may remain. This feature does not store the report on a server. The report stays in this page until refresh unless downloaded.</p>'
  +'<label class="align-confirm"><input type="checkbox" id="alignConfirm" '+(alignment.confirmedJob===state.jobPosting && state.jobPosting?'checked':'')+' onchange="alignment.confirmedJob=this.checked?state.jobPosting:\'\'"> I checked that the job text is the correct, complete posting and want to send the displayed content for this review.</label>'
  +'<button type="button" class="btn btn-primary" '+(alignment.busy?'disabled':'')+' onclick="runAlignmentReview()">'+(alignment.busy?'Working…':'Run AI Alignment Review')+'</button><p id="alignStatus" role="status" aria-live="polite">'+esc(alignment.message)+'</p><div id="alignmentReport">'+alignmentReportHTML()+'</div></section>'
  +'<details style="margin-top:18px"><summary>Quick keyword check — no AI / no content sent</summary><div id="jobMatchArea">'+renderJobMatch(matchKeywords())+'</div></details>';
}
async function alignmentRequest(path,body){
  const endpoint=new URL(AI_POLISH_ENDPOINT);endpoint.pathname=path;endpoint.search='';endpoint.hash='';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),65000);
  try{const response=await fetch(endpoint.toString(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error || 'The service is unavailable. Please try again later.');return data;
  }catch(err){if(err.name==='AbortError')throw new Error('The request timed out. Please try again.');throw err;}finally{clearTimeout(timer);}
}
function alignmentRefresh(){if(state.activeTab==='job')renderFormPanel();}
async function retrieveAlignmentJob(){
  if(alignment.busy)return;
  const raw=alignment.url.trim();try{if(new URL(raw).protocol!=='https:')throw new Error();}catch{alignment.retrievalMessage='Enter a complete HTTPS job posting URL, or paste the description below.';alignmentRefresh();return;}
  if(state.jobPosting.trim() && !window.confirm('Replace the current job posting text with text from this URL? Your resume will not change.'))return;
  const before=JSON.stringify(state);alignment.busy=true;alignment.retrievalMessage='Retrieving the job posting…';alignmentRefresh();
  try{const data=await alignmentRequest('/job-posting',{url:raw});
    if(JSON.stringify(state)!==before || alignment.url.trim()!==raw){alignment.retrievalMessage='Your inputs changed while retrieval was running. No text was replaced; retrieve again when ready.';return;}
    if(typeof data.text!=='string' || data.text.length<100)throw new Error('No usable posting was returned. Paste the job description instead.');
    state.jobPosting=data.text;alignment.confirmedJob='';alignment.report=null;persist();renderRail();
    alignment.retrievalMessage=(data.notice||'Posting retrieved.')+' Review and edit the text below before confirming it.';
  }catch(err){alignment.retrievalMessage=err.message+' Your existing text is unchanged.';}finally{alignment.busy=false;alignmentRefresh();}
}
async function runAlignmentReview(){
  if(alignment.busy)return;
  const resume=alignmentResume(),jobPosting=state.jobPosting.trim();
  if(resume.trim().length<40 || resume.length>16000){alignment.message='Add meaningful resume content first (40–16,000 characters).';alignmentRefresh();return;}
  if(jobPosting.length<100 || jobPosting.length>40000){alignment.message='Provide a job description containing 100–40,000 characters.';alignmentRefresh();return;}
  if(alignment.confirmedJob!==state.jobPosting){alignment.message='Review the posting and select the confirmation checkbox before running AI.';alignmentRefresh();return;}
  const snapshot=alignmentSnapshot();alignment.report=null;alignment.busy=true;alignment.message='Reviewing your resume against the posting. Your resume will not be changed…';alignmentRefresh();
  try{const data=await alignmentRequest('/align',{resume,jobPosting});
    if(snapshot!==alignmentSnapshot()){alignment.message='Your resume or job text changed during analysis. Run a new review; the outdated result was discarded.';return;}
    if(!Array.isArray(data.findings) || !data.findings.length)throw new Error('No usable report was returned. Please try again.');
    alignment.report=data;alignment.snapshot=snapshot;alignment.message='Review complete. Verify the findings against the supporting excerpts.';
  }catch(err){alignment.message=err.message+' Your resume is unchanged; the local keyword check remains available.';}finally{alignment.busy=false;alignmentRefresh();}
}
function downloadAlignmentReport(){
  if(!alignment.report || alignment.snapshot!==alignmentSnapshot())return;
  const r=alignment.report;let text='RESUME ALIGNMENT REVIEW\n'+new Date(r.generatedAt).toLocaleString()+'\n\nAdvisory, partial review—not an ATS score or hiring prediction. Verify all conclusions. Your resume has not been changed.\n';
  if(r.omitted)text+='\n'+r.omitted+' finding(s) omitted because supporting text could not be verified.\n';
  for(const f of r.findings)text+='\n'+({match:'CLEAR MATCH',related:'RELATED / PARTIAL EVIDENCE',not_demonstrated:'NOT DEMONSTRATED IN THIS RESUME'}[f.category])+': '+f.requirement+'\nPriority: '+f.priority+'\nJob posting: '+f.jobEvidence+'\nResume: '+(f.resumeEvidence||'No supporting evidence identified; this does not mean you lack the skill.')+'\nKeyword: '+f.keyword+'\nSuggested action: '+f.recommendation+'\nOnly add wording or evidence if accurate.\n';
  const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='resume-alignment-review.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* =====================================================================
   INIT
   ===================================================================== */
(function init(){
  const loaded = loadFromStorage();
  if(!loaded) seedIfEmpty();
  else {
    // recompute idCounter so future genId() calls don't collide with restored ids
    const allIds = [].concat(state.experienceOrder||[], state.educationOrder||[], state.projectsOrder||[], state.leadershipOrder||[]);
    allIds.forEach(id => { const n = parseInt(id.slice(1),10); if(!isNaN(n) && n > idCounter) idCounter = n; });
    seedIfEmpty();
  }
  renderAll();
})();
</script>
