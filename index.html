<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder &amp; Job-Match Coach</title>
<style>
  :root{
    --ink:#1E2A3D;
    --collin-blue:#0C2E82;
    --paper:#FAFAF7;
    --panel:#FFFFFF;
    --kraft:#C9A66B;
    --kraft-dark:#A9803F;
    --teal:#2C6E63;
    --teal-dark:#1E4F47;
    --slate:#57626F;
    --slate-light:#8C95A1;
    --line:#DEDAD0;
    --amber:#B8752E;
    --amber-bg:#FBF1E3;
    --green:#3F7D58;
    --green-bg:#EAF3ED;
    --red:#B3452C;
    --red-bg:#FBEAE4;
    --radius:6px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input, textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--collin-blue);
    color:var(--paper);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--kraft);
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand img{height:44px;width:auto;display:block;background:#fff;border-radius:4px;padding:4px 8px;}
  header.top .title-block h1{
    font-family:var(--serif);
    font-size:1.25rem;
    margin:0 0 2px 0;
    font-weight:700;
    letter-spacing:0.01em;
  }
  header.top .title-block p{
    margin:0;
    font-size:0.78rem;
    color:#C9D3EA;
    font-family:var(--mono);
    letter-spacing:0.03em;
  }
  header.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:9px 14px;
    font-size:0.85rem;
    font-weight:600;
    transition:transform .04s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--paper);border-color:#4A5468;}
  .btn-ghost:hover{border-color:var(--kraft);}
  .btn-outline{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-outline:hover{border-color:var(--slate);}
  .btn-small{padding:5px 10px;font-size:0.75rem;}
  .btn-remove{background:none;border:none;color:var(--red);font-size:0.78rem;font-weight:600;text-decoration:underline;padding:2px 0;}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:210px minmax(320px,1fr) 380px;min-height:calc(100vh - 66px);}
  @media (max-width:1080px){
    .app{grid-template-columns:1fr;}
    .rail{display:flex;overflow-x:auto;padding:10px 12px;gap:8px;border-bottom:1px solid var(--line);}
    .rail .tab{flex:0 0 auto;}
    .preview-col{border-top:6px solid var(--kraft);}
  }

  /* ---------- Tab rail (binder tabs) ---------- */
  .rail{
    background:#F1EEE6;
    padding:20px 0;
    border-right:1px solid var(--line);
  }
  .tab{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:4px solid transparent;
    padding:11px 14px;
    font-size:0.83rem;
    color:var(--slate);
    font-weight:600;
  }
  .tab .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--line);
    flex:0 0 auto;
  }
  .tab.complete .dot{background:var(--teal);}
  .tab.active{
    background:var(--panel);
    color:var(--ink);
    border-left-color:var(--kraft-dark);
  }
  .tab .opt{
    font-family:var(--mono);
    font-size:0.62rem;
    color:var(--slate-light);
    font-weight:400;
    margin-left:auto;
  }

  /* ---------- Form column ---------- */
  .form-col{padding:28px 30px;background:var(--panel);overflow-y:auto;}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 4px 0;}
  .section-head .guide{
    font-size:0.85rem;color:var(--slate);
    background:var(--amber-bg);
    border-left:3px solid var(--kraft-dark);
    padding:9px 12px;
    border-radius:0 var(--radius) var(--radius) 0;
    margin-top:8px;
  }
  label{display:block;font-size:0.78rem;font-weight:700;color:var(--slate);margin-bottom:5px;letter-spacing:0.01em;}
  label.full{margin-top:14px;}
  .hint{font-weight:400;font-size:0.78rem;color:var(--slate-light);margin-bottom:6px;font-style:italic;}
  input[type=text], input[type=email], input[type=tel], textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:0.92rem;
    color:var(--ink);
    background:#fff;
    margin-bottom:14px;
  }
  input:focus, textarea:focus, button:focus, .tab:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.45;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}
  .entry-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:16px;
    background:#FDFCFA;
    position:relative;
  }
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .entry-num{font-family:var(--mono);font-size:0.72rem;color:var(--kraft-dark);font-weight:700;letter-spacing:0.04em;}
  .add-btn{
    background:#fff;border:1.5px dashed var(--slate-light);color:var(--slate);
    border-radius:var(--radius);padding:10px;width:100%;font-size:0.85rem;font-weight:600;
  }
  .add-btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .coach-feedback{margin-top:6px;font-size:0.78rem;}
  .flag{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border-radius:5px;margin-bottom:5px;line-height:1.4;}
  .flag.amber{background:var(--amber-bg);color:#7A4D1D;}
  .flag.red{background:var(--red-bg);color:#7C3018;}
  .flag.green{background:var(--green-bg);color:#265239;}
  .flag b{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;margin-right:2px;}

  .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:0.78rem;
    border:1px solid var(--line);
  }
  .chip.matched{background:var(--green-bg);color:#265239;border-color:#BFE0CC;}
  .chip.missing{background:var(--amber-bg);color:#7A4D1D;border-color:#EAD3A6;}

  /* ---------- Preview column ---------- */
  .preview-col{
    background:#EFECE3;
    padding:26px 22px;
    overflow-y:auto;
    border-left:1px solid var(--line);
  }
  .preview-label{
    font-family:var(--mono);font-size:0.72rem;color:var(--slate);
    text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  .paper{
    background:#fff;
    box-shadow:0 2px 14px rgba(30,42,61,0.14);
    padding:0.65in 0.6in;
    min-height:9in;
    font-family:Aptos, Arial, Helvetica, sans-serif;
    font-size:10.4pt;
    color:#111;
    line-height:1.35;
  }
  .r-name{text-align:center;font-size:19pt;font-weight:700;margin:0 0 2px 0;}
  .r-contact{text-align:center;font-size:9.5pt;margin:0 0 14px 0;color:#222;}
  .r-h-table{width:100%;border-collapse:collapse;margin:16px 0 6px 0;}
  .r-h{font-weight:700;font-size:12.5pt;letter-spacing:0.02em;border-bottom:1.4pt solid #111;padding-bottom:2px;text-align:left;}
  .r-row-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10.2pt;}
  .r-row-table td{padding:0;vertical-align:top;}
  .r-row-table td.r-right{text-align:right;white-space:nowrap;padding-left:12px;}
  .r-row b{font-weight:700;}
  .r-title{font-style:italic;font-size:10.2pt;margin:1px 0 3px 0;}
  .r-ul{margin:2px 0 0 0;padding-left:18px;}
  .r-ul li{margin-bottom:2px;}
  .r-empty{color:#9AA1AA;font-style:italic;}
  .r-p{margin:0 0 4px 0;}

  .save-status{font-size:0.72rem;color:var(--slate);font-family:var(--mono);}
  .save-status button{background:none;border:none;color:var(--teal-dark);text-decoration:underline;font-size:0.72rem;font-family:var(--mono);padding:0;margin-left:8px;}

  .review-block{margin-bottom:22px;}
  .review-block h3{font-family:var(--serif);font-size:1.05rem;margin:0 0 8px 0;}
  .count-pill{display:inline-flex;align-items:center;gap:6px;background:#F1EEE6;border-radius:999px;padding:4px 12px;font-size:0.8rem;margin-right:8px;margin-bottom:6px;}
  .footer-note{font-size:0.78rem;color:var(--slate);margin-top:6px;}

  input[type=file]{display:none;}

  @media print{
    header.top,.rail,.form-col,.preview-label,.save-status{display:none !important;}
    .app{display:block;}
    .preview-col{background:#fff;padding:0;border:none;}
    .paper{box-shadow:none;padding:0;min-height:0;}
  }
</style>
</head>

<script>
/* =====================================================================
   DATA
   ===================================================================== */
const GUIDING = {
  summary: "General statement about who you are, your relevant experience, and the goal of your search. 1–4 sentences. Avoid first-person language (I, me, my, mine) — write it the way it will read on the page.",
  coreSkills: "Foundational, teachable abilities that are relevant to the job you want (e.g., Data Entry, Spanish Fluency, Adobe Photoshop).",
  keyStrengths: "Qualities that influence HOW you work (e.g., Empathetic Communicator, Analytical Thinker, Calm Under Pressure).",
  competencies: "Higher-level abilities that blend skill + experience + judgment (e.g., Data-Driven Decision Support, Cross-Team Coordination).",
  expBullets: "One line per bullet. Mix: (1) specific tasks/responsibilities, (2) accomplishments — quantify if you can (numbers, %, $, time), and (3) any above-and-beyond moments.",
  eduFocus: "The specific focus of your program, relevant coursework, or honors — one short line is plenty.",
  leadBullets: "One line per bullet: what you accomplished, contributed, or the honor you received.",
  additional: "Only include what's not already covered above. If a technical skill or certification is directly relevant to the job you want, it usually belongs in Summary or Education instead."
};

const WEAK_STARTERS = ["responsible for","in charge of","duties included","worked on","helped with","assisted with","involved in","tasked with","was in charge of","did work on"];

const AI_CLICHES = ["spearheaded","leverage","leveraged","leveraging","synergy","synergies","utilize","utilizing","utilized","in order to","passionate about","results-driven","results driven","dynamic team player","proven track record","seamlessly","robust solution","cutting-edge","game-changer","game changer","ensure smooth","dive into","delve into","furthermore","moreover","holistic approach","paradigm shift","unlock","elevate","elevating","empower","empowering","foster","fostering","streamline","streamlined solution","bespoke","tailored solution","world-class","best-in-class","strategic vision","thought leader","circle back","touch base","low-hanging fruit"];

const STRONG_VERBS = {
  "Leadership": ["Led","Directed","Coordinated","Organized","Mentored","Trained","Supervised"],
  "Communication": ["Presented","Facilitated","Authored","Negotiated","Advised","Communicated"],
  "Analysis": ["Analyzed","Evaluated","Assessed","Diagnosed","Researched","Audited"],
  "Operations": ["Streamlined","Implemented","Executed","Managed","Maintained","Processed"],
  "Creative": ["Designed","Developed","Produced","Created","Launched","Drafted"],
  "Technical": ["Built","Programmed","Configured","Automated","Engineered","Repaired"]
};

const CLICHE_SWAP = {
  "spearheaded":"led","spearheading":"leading","spearhead":"lead",
  "leverage":"use","leverages":"uses","leveraged":"used","leveraging":"using",
  "utilize":"use","utilizes":"uses","utilizing":"using","utilized":"used",
  "passionate about":"focused on","results-driven":"reliable and outcome-focused","results driven":"reliable and outcome-focused",
  "dynamic team player":"collaborative team member","proven track record":"consistent record",
  "seamlessly":"smoothly","seamless":"smooth","cutting-edge":"current","game-changer":"major improvement","game changer":"major improvement",
  "streamlined solution":"simplified approach","streamline":"simplify","streamlines":"simplifies","streamlined":"simplified",
  "holistic approach":"complete approach","unlock":"support","unlocks":"supports","elevate":"improve","elevates":"improves","elevating":"improving",
  "empower":"support","empowers":"supports","empowering":"supporting","foster":"build","fosters":"builds","fostering":"building",
  "bespoke":"custom","tailored solution":"custom approach","world-class":"high-quality","best-in-class":"top-tier",
  "strategic vision":"clear plan","thought leader":"experienced voice","in order to":"to","robust solution":"strong approach"
};
function swapCliches(text){
  let out = text;
  Object.keys(CLICHE_SWAP).sort((a,b)=>b.length-a.length).forEach(k=>{
    const re = new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi");
    out = out.replace(re, CLICHE_SWAP[k]);
  });
  return out;
}
function stripFirstPersonSentence(sentence){
  let out = (sentence||"").trim();
  out = out.replace(/^i\s*'?m\s+an?\s+/i, "");
  out = out.replace(/^i\s+am\s+an?\s+/i, "");
  out = out.replace(/^i\s+am\s+looking\s+for\s+/i, "seeking ");
  out = out.replace(/^i\s+am\s+interested\s+in\s+/i, "seeking ");
  out = out.replace(/^i\s+am\s+(hoping|aiming)\s+to\s+/i, "$1 to ");
  out = out.replace(/^i\s+am\s+/i, "");
  out = out.replace(/^i\s+(have|possess)\s+/i, "");
  out = out.replace(/^i\s+/i, "");
  out = out.replace(/\bi've\b/gi, "have");
  out = out.replace(/\bi'm\b/gi, "am");
  out = out.replace(/\bmy\s+/gi, "");
  out = out.replace(/\s{2,}/g," ").trim();
  if(out.length) out = out.charAt(0).toUpperCase() + out.slice(1);
  return out;
}
function stripFirstPerson(text){
  const parts = splitSentences(text||"");
  if(parts.length === 0) return "";
  return parts.map(stripFirstPersonSentence).join(" ");
}
function joinNatural(arr){
  if(arr.length === 0) return "";
  if(arr.length === 1) return arr[0];
  if(arr.length === 2) return arr[0] + " and " + arr[1];
  return arr.slice(0,-1).join(", ") + ", and " + arr[arr.length-1];
}
function trimToSentences(text, max){
  const parts = splitSentences(text);
  return parts.slice(0, max).join(" ").trim();
}
function cleanPass(text){
  let out = stripFirstPerson(text);
  out = swapCliches(out);
  out = trimToSentences(out, 4);
  return out;
}
function firstItems(csv, n){
  if(!csv) return [];
  return csv.split(",").map(s=>s.trim()).filter(Boolean).slice(0, n);
}
function detectGoalClause(text){
  const m = text.match(/([^.!?]*\b(seeking|looking for|interested in|hoping to|aiming to|goal is to)\b[^.!?]*[.!?]?)/i);
  return m ? m[1].trim() : null;
}
function detectJobTitle(jobText){
  if(!jobText || !jobText.trim()) return null;
  let m = jobText.match(/\b(?:job title|position|role|title)\s*[:\-]\s*([A-Z][A-Za-z&/ ]{2,40})/);
  if(m) return m[1].trim().replace(/\s+/g," ");
  const kws = extractKeywords(jobText.split(/\n/).slice(0,3).join(" "));
  const multiWord = kws.find(k => k.term.split(" ").length >= 2 && /^[A-Z]/.test(k.term));
  return multiWord ? multiWord.term : null;
}
function buildSummaryVariants(){
  const original = state.summary || "";
  if(!original.trim()) return null;
  const cleaned = cleanPass(original);
  const goalClause = detectGoalClause(original);
  const remainder = goalClause ? cleanPass(original.replace(goalClause, "").trim()) : "";
  const strengths = firstItems(state.keyStrengths, 2).concat(firstItems(state.competencies, 1));
  const skills = firstItems(state.coreSkills, 3);

  const variants = [{label:"Cleaned", text: cleaned}];

  if(goalClause && remainder){
    let g = cleanPass(goalClause);
    g = g.charAt(0).toLowerCase() + g.slice(1);
    variants.push({label:"Goal-first", text: (remainder.replace(/[.]$/,"") + ", " + g).trim()});
  } else if(skills.length){
    variants.push({label:"Goal-first", text: (cleaned.replace(/[.]$/,"") + ", with skills in " + joinNatural(skills) + ".").trim()});
  }

  if(strengths.length){
    const lead = joinNatural(strengths) + "-focused professional";
    const rest = cleaned.replace(/^[A-Z]/, c=>c.toLowerCase());
    variants.push({label:"Strength-first", text: (lead + " — " + rest).trim()});
  } else {
    const sentences = splitSentences(original);
    if(sentences.length >= 2){
      const reordered = [sentences[1], sentences[0]].concat(sentences.slice(2)).join(" ");
      variants.push({label:"Reordered", text: cleanPass(reordered)});
    }
  }

  if(state.jobPosting && state.jobPosting.trim()){
    const jobTitle = detectJobTitle(state.jobPosting);
    const match = matchKeywords();
    const preferred = match.matched.filter(t => t.includes(" ") || /^[A-Z]/.test(t));
    const topMatched = (preferred.length ? preferred : match.matched).slice(0,3);
    const base = (remainder && goalClause) ? remainder : cleaned.replace(/[.]$/,"");
    const bits = [];
    if(topMatched.length) bits.push("with proven strength in " + joinNatural(topMatched));
    if(jobTitle) bits.push("seeking a " + jobTitle + " role");
    if(bits.length){
      variants.push({label:"Job-targeted", text: (base.replace(/[.]$/,"") + ", " + bits.join(", ") + ".").trim()});
    }
  }

  const seen = new Set();
  return variants.filter(v => {
    const key = v.text.toLowerCase();
    if(seen.has(key) || !v.text.trim()) return false;
    seen.add(key);
    return true;
  });
}

function esc(s){

}
function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o===undefined||o===null)?o:o[k], obj); }
function setPath(obj, path, value){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(!(parts[i] in o) || typeof o[parts[i]] !== "object" || o[parts[i]]===null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
}

function splitSentences(text){

/* =====================================================================
   COACHING ANALYSIS (rule-based — nothing here is AI-generated text)
   ===================================================================== */
function analyzeSummary(text){
  const flags = [];
  if(!text || !text.trim()) return flags;
  if(/\b(i'm|i've|i|my|me|mine)\b/i.test(text)){
    flags.push({level:"amber", tag:"VOICE", msg:"Contains first-person language (I / my / me). The template calls for third-person, e.g. \"Customer-focused professional with...\" instead of \"I am a customer-focused professional...\""});
  }
  const sentenceCount = (text.match(/[.!?]+/g)||[]).length || (text.trim()?1:0);
  if(sentenceCount > 4){
    flags.push({level:"amber", tag:"LENGTH", msg:"Longer than the suggested 1–4 sentences. Consider trimming to the most relevant points."});
  }
  const lower = text.toLowerCase();
  const foundCliche = AI_CLICHES.find(c => lower.includes(c));
  if(foundCliche){
    flags.push({level:"red", tag:"PHRASING", msg:"Contains \""+foundCliche+"\" — a phrase that often reads as generic or AI-sounding. Try describing it plainly in your own words."});
  }
  if(flags.length===0){
    flags.push({level:"green", tag:"OK", msg:"Reads clearly and in third person."});
  }
  return flags;
}

function analyzeBulletLine(line){
  const flags = [];
  const lower = line.toLowerCase();
  const starter = WEAK_STARTERS.find(w => lower.startsWith(w));
  if(starter){
    const cats = Object.keys(STRONG_VERBS);
    const cat = cats[Math.floor(Math.random()*cats.length)];
    const verbs = STRONG_VERBS[cat].slice(0,3).join(", ");
    flags.push({level:"amber", tag:"VERB", msg:"Starts with a soft phrase (\""+starter+"\"). Try opening with a stronger verb like "+verbs+"."});
  }
  const foundCliche = AI_CLICHES.find(c => lower.includes(c));
  if(foundCliche){
    flags.push({level:"red", tag:"PHRASING", msg:"Contains \""+foundCliche+"\" — consider your own plainer wording instead."});
  }
  if(line.length > 35 && !/[\d%$]/.test(line)){
    flags.push({level:"amber", tag:"NUMBER", msg:"No number yet — if you can measure it (count, %, $, time saved), consider adding one."});
  }
  return flags;
}

function analyzeBulletsBlock(text){
  const ls = lines(text);
  const results = [];
  ls.forEach((line, i) => {
    const flags = analyzeBulletLine(line);
    flags.forEach(f => results.push(Object.assign({line:i+1}, f)));
  });
  return results;
}

function renderFlagList(flags, emptyMsg){
  if(!flags || flags.length===0){
    return '<div class="flag green"><b>OK</b>'+esc(emptyMsg||"No notes here.")+'</div>';
  }
  const capped = flags.slice(0,5);
  let html = capped.map(f => {
    const prefix = f.line ? ("Line "+f.line+" — ") : "";
    return '<div class="flag '+f.level+'"><b>'+f.tag+'</b>'+esc(prefix+f.msg)+'</div>';
  }).join("");
  if(flags.length > 5){
    html += '<div class="footer-note">+'+(flags.length-5)+' more note(s) below.</div>';
  }
  return html;
}

/* =====================================================================
   KEYWORD MATCHING
   ===================================================================== */
function extractKeywords(jobText){
  if(!jobText || !jobText.trim()) return [];
  const capPhrases = {};
  const capRegex = /\b([A-Z][a-zA-Z+#]*(?:\s+[A-Z][a-zA-Z+#]*){0,2})\b/g;
  let m;
  while((m = capRegex.exec(jobText)) !== null){
    const phrase = m[1].trim();
    if(phrase.split(" ").length > 3) continue;
    const lowerWords = phrase.toLowerCase().split(" ");
    if(lowerWords.every(w => STOPWORDS.has(w))) continue;
    if(phrase.length < 3) continue;
    capPhrases[phrase] = (capPhrases[phrase]||0) + 1;
  }
  const words = jobText.toLowerCase().replace(/[^a-z0-9+#\s]/g," ").split(/\s+/).filter(Boolean);
  const freq = {};
  words.forEach(w => {
    if(w.length < 4 || STOPWORDS.has(w) || /^\d+$/.test(w)) return;
    freq[w] = (freq[w]||0) + 1;
  });
  const combined = {};
  Object.keys(capPhrases).forEach(k => combined[k] = (combined[k]||0) + capPhrases[k]*2);
  Object.keys(freq).forEach(k => combined[k] = (combined[k]||0) + freq[k]);
  return Object.entries(combined)
    .sort((a,b)=> b[1]-a[1])
    .slice(0, 24)
    .map(([term,count]) => ({term,count}));
}

function buildResumeText(){
  const parts = [state.summary, state.coreSkills, state.keyStrengths, state.competencies,
    state.additional.technical, state.additional.other, state.additional.quals, state.additional.interests];
  state.experienceOrder.forEach(id => { const e=state.experience[id]; parts.push(e.title, e.employer, e.bullets); });
  state.educationOrder.forEach(id => { const e=state.education[id]; parts.push(e.degree, e.institution, e.focus); });
  state.leadershipOrder.forEach(id => { const e=state.leadership[id]; parts.push(e.role, e.org, e.bullets); });
  return parts.join(" ").toLowerCase();
}

function matchKeywords(){
  const kws = extractKeywords(state.jobPosting);
  const resumeText = buildResumeText();
  const matched = [], missing = [];
  kws.forEach(k => {
    if(resumeText.includes(k.term.toLowerCase())) matched.push(k.term);
    else missing.push(k.term);
  });
  return {matched: matched.slice(0,16), missing: missing.slice(0,16)};
}

    html += '<div class="entry-card" style="background:#fff;">'
      + '<div class="entry-head"><span class="entry-num">'+esc(v.label.toUpperCase())+'</span>'
      + '<button type="button" class="btn btn-primary btn-small" onclick="useSummaryVariant('+i+')">Use this version</button></div>'
      + '<p style="font-size:0.92rem;line-height:1.5;margin:0 0 8px 0;">'+esc(v.text)+'</p>'
      + '<div class="coach-feedback">'+renderFlagList(flags, "Reads clearly.")+'</div>'
      + '</div>';
  });
  html += '</div>';
  panel.innerHTML = html;
}
function useSummaryVariant(i){
  const variants = window.__summaryVariants;
  if(!variants || !variants[i]) return;
  state.summary = variants[i].text;
  persist();
  renderFormPanel();
  renderPreview();
  renderRail();
}

function experienceCard(id, index){
  const e = state.experience[id];
  return '<div class="entry-card"><div class="entry-head"><span class="entry-num">JOB '+(index+1)+'</span>'
    + (state.experienceOrder.length>1 ? '<button type="button" class="btn-remove" onclick="removeEntry(\'experience\',\''+id+'\')">Remove</button>' : '')
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Employer","experience."+id+".employer",e.employer,"Collin Creek Library")
    + fieldInput("City, State","experience."+id+".location",e.location,"Plano, TX")
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Job title","experience."+id+".title",e.title,"Circulation Assistant")
    + fieldInput("Dates","experience."+id+".dates",e.dates,"Jun 2023 – Present")
    + '</div>'
    + '<label for="exp-bul-'+id+'">Bullets — one per line</label>'
    + '<div class="hint">'+GUIDING.expBullets+'</div>'
    + '<textarea id="exp-bul-'+id+'" data-path="experience.'+id+'.bullets" data-coach="bullets" rows="4" placeholder="Checked in and shelved 200+ items daily">'+esc(e.bullets)+'</textarea>'
    + '<div class="coach-feedback" id="exp-bul-'+id+'-feedback"></div>'
    + '</div>';
}

function renderExperienceTab(){
  let html = '<div class="section-head"><h2>Experience</h2></div>';
  html += state.experienceOrder.map((id,i)=>experienceCard(id,i)).join("");
  html += '<button type="button" class="add-btn" onclick="addEntry(\'experience\')">+ Add another job</button>';
  return html;
}

    + (state.educationOrder.length>1 ? '<button type="button" class="btn-remove" onclick="removeEntry(\'education\',\''+id+'\')">Remove</button>' : '')
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Institution","education."+id+".institution",e.institution,"Collin College")
    + fieldInput("City, State","education."+id+".location",e.location,"McKinney, TX")
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Degree/Certification","education."+id+".degree",e.degree,"A.A.S. in Business Administration")
    + fieldInput("Graduation month/year","education."+id+".gradDate",e.gradDate,"May 2026")
    + '</div>'
    + '<label for="edu-focus-'+id+'">Program focus (optional)</label>'
    + '<div class="hint">'+GUIDING.eduFocus+'</div>'
    + '<input type="text" id="edu-focus-'+id+'" data-path="education.'+id+'.focus" value="'+esc(e.focus)+'" placeholder="Focus in Small Business Operations">'
    + '</div>';
}

function renderEducationTab(){
  let html = '<div class="section-head"><h2>Education</h2></div>';
  html += state.educationOrder.map((id,i)=>educationCard(id,i)).join("");
  html += '<button type="button" class="add-btn" onclick="addEntry(\'education\')">+ Add another school</button>';
  return html;
}

function leadershipCard(id, index){
  const e = state.leadership[id];
  return '<div class="entry-card"><div class="entry-head"><span class="entry-num">ENTRY '+(index+1)+'</span>'
    + '<button type="button" class="btn-remove" onclick="removeEntry(\'leadership\',\''+id+'\')">Remove</button>'
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Organization/Event","leadership."+id+".org",e.org,"Habitat for Humanity")
    + fieldInput("City, State","leadership."+id+".location",e.location,"Garland, TX")
    + '</div>'
    + '<div class="field-row">'
    + fieldInput("Your role","leadership."+id+".role",e.role,"Volunteer Build Team Lead")
    + fieldInput("Dates","leadership."+id+".dates",e.dates,"Mar 2025")
    + '</div>'
    + '<label for="lead-bul-'+id+'">Bullets — one per line</label>'
    + '<div class="hint">'+GUIDING.leadBullets+'</div>'
    + '<textarea id="lead-bul-'+id+'" data-path="leadership.'+id+'.bullets" data-coach="bullets" rows="3" placeholder="Organized a 12-person volunteer crew for a weekend build">'+esc(e.bullets)+'</textarea>'
    + '<div class="coach-feedback" id="lead-bul-'+id+'-feedback"></div>'
    + '</div>';
}

function renderLeadershipTab(){
  let html = '<div class="section-head"><h2>Leadership, Community Service, Recognition</h2><div class="guide">Optional, but valuable if you\'re light on paid experience — this section fills the same role.</div></div>';
  html += state.leadershipOrder.map((id,i)=>leadershipCard(id,i)).join("");
  html += '<button type="button" class="add-btn" onclick="addEntry(\'leadership\')">+ Add an entry</button>';
  return html;
}

function renderAdditionalTab(){
  const a = state.additional;
  return '<div class="section-head"><h2>Additional Information</h2><div class="guide">'+GUIDING.additional+'</div></div>'
    + '<label for="add-tech">Technical Skills</label>'
    + '<textarea id="add-tech" data-path="additional.technical" rows="2" placeholder="Microsoft Excel, POS systems, basic HTML">'+esc(a.technical)+'</textarea>'
    + '<label for="add-other">Other Skills</label>'
    + '<textarea id="add-other" data-path="additional.other" rows="2" placeholder="Project planning, attention to detail">'+esc(a.other)+'</textarea>'
    + '<label for="add-quals">Other Qualifications</label>'
    + '<textarea id="add-quals" data-path="additional.quals" rows="2" placeholder="CPR Certified, Food Handler\'s License">'+esc(a.quals)+'</textarea>'
    + '<label for="add-interests">Interests</label>'
    + '<textarea id="add-interests" data-path="additional.interests" rows="2" placeholder="Community theater, youth soccer coaching">'+esc(a.interests)+'</textarea>';
}

function renderJobTab(){
  const r = matchKeywords();
  return '<div class="section-head"><h2>Target Job</h2><div class="guide">Paste in the job posting text (not the URL). We\'ll pull out likely keywords and compare them to what\'s already in your resume — nothing gets added automatically.</div></div>'
    + '<label for="jobText">Job posting text</label>'
    + '<textarea id="jobText" data-path="jobPosting" data-coach="job" rows="10" placeholder="Paste the full job description here...">'+esc(state.jobPosting)+'</textarea>'
    + '<div id="jobMatchArea">'+renderJobMatch(r)+'</div>';
}

function renderJobMatch(r){
  if(!state.jobPosting.trim()) return '<p class="hint">Paste a job posting above to see a keyword comparison.</p>';
  let html = '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>Already in your resume:</b></p>';
  html += '<div class="tags-row">' + (r.matched.length? r.matched.map(t=>'<span class="chip matched">'+esc(t)+'</span>').join(""): '<span class="hint">No overlap found yet.</span>') + '</div>';
  html += '<p style="font-size:0.85rem;color:var(--slate);margin-top:14px;"><b>Shows up in the posting, not yet in your resume:</b></p>';
  html += '<div class="tags-row">' + (r.missing.length? r.missing.map(t=>'<span class="chip missing">'+esc(t)+'</span>').join(""): '<span class="hint">Nothing obvious missing.</span>') + '</div>';
  html += '<p class="footer-note">Only add a term to your resume if it\'s honestly true of your experience — don\'t add a skill you don\'t have just to match the posting.</p>';
  return html;
}

function collectAllFlags(){
  const totals = {red:0, amber:0};
  const tally = (flags)=>{ flags.forEach(f=>{ if(f.level==="red") totals.red++; else if(f.level==="amber") totals.amber++; }); };
  tally(analyzeSummary(state.summary));
  state.experienceOrder.forEach(id => tally(analyzeBulletsBlock(state.experience[id].bullets)));
  state.leadershipOrder.forEach(id => tally(analyzeBulletsBlock(state.leadership[id].bullets)));
  return totals;
}

function renderReviewTab(){
  const totals = collectAllFlags();
  const r = matchKeywords();
  let html = '<div class="section-head"><h2>Review &amp; Export</h2></div>';

  html += '<div class="review-block"><h3>Language check</h3>';
  html += '<span class="count-pill">🟠 '+totals.amber+' phrasing/quantify note(s)</span>';
  html += '<span class="count-pill">🔴 '+totals.red+' possible AI-sounding phrase(s)</span>';
  html += '<p class="footer-note">Head back to Summary, Experience, or Leadership to see the specific lines.</p></div>';

  html += '<div class="review-block"><h3>Job-match keywords</h3>';
  if(state.jobPosting.trim()){
    html += '<div class="tags-row">'+ r.matched.slice(0,10).map(t=>'<span class="chip matched">'+esc(t)+'</span>').join("") +'</div>';
    html += '<p class="footer-note">'+r.missing.length+' term(s) from the posting aren\'t reflected yet — see the Target Job tab.</p>';
  } else {
    html += '<p class="hint">Add a job posting on the Target Job tab to see a match report.</p>';
  }
  html += '</div>';

  html += '<div class="review-block"><h3>Build your final summary</h3>'
    + '<p class="footer-note" style="margin-bottom:8px;">Now that your experience and (optionally) a target job posting are in, see refined summary options built from all of it.</p>'
    + '<button type="button" class="btn btn-outline btn-small" onclick="showSummaryPolish(\'reviewSummaryPolishPanel\')">Polish my summary</button>'
    + '<div id="reviewSummaryPolishPanel"></div>'
    + '</div>';

  html += '<div class="review-block"><h3>Export</h3>'
    + '<button class="btn btn-primary" onclick="downloadWord()">Download Word Resume (.doc)</button> '
    + '<button class="btn btn-outline" onclick="window.print()">Print / Save as PDF</button>'
    + '<p class="footer-note">The Word file opens directly in Microsoft Word or Google Docs. In Word, use "Save As" → .docx to convert it to the standard editable format.</p>'
    + '<p class="footer-note">When printing/saving as PDF, if your browser\'s print preview shows a title and date at the top of the page, open "More settings" in the print dialog and uncheck "Headers and footers" — that\'s a browser setting, not part of the resume.</p>'
    + '</div>';

  html += '<div class="review-block"><h3>Your data</h3>'
    + '<button class="btn btn-outline btn-small" onclick="saveProgressFile()">Save a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="document.getElementById(\'loadFileInput\').click()">Load a backup file</button> '
    + '<button class="btn btn-outline btn-small" onclick="clearData()" style="color:var(--red);border-color:var(--red);">Clear my data</button>'
    + '<p class="footer-note">Everything here stays in your browser — nothing is sent to a server. On a shared or lab computer, save a backup file so you can pick this up later.</p>'
    + '</div>';

  return html;
}

/* =====================================================================
   ENTRY ADD/REMOVE
   ===================================================================== */
function addEntry(kind){
  const id = genId(kind[0]);
  if(kind==="experience"){ state.experience[id] = freshExperience(); state.experienceOrder.push(id); }
  if(kind==="education"){ state.education[id] = freshEducation(); state.educationOrder.push(id); }
  if(kind==="leadership"){ state.leadership[id] = freshLeadership(); state.leadershipOrder.push(id); }
  persist(); renderAll();
}
function removeEntry(kind, id){
  if(kind==="experience"){ delete state.experience[id]; state.experienceOrder = state.experienceOrder.filter(x=>x!==id); }
  if(kind==="education"){ delete state.education[id]; state.educationOrder = state.educationOrder.filter(x=>x!==id); }
  if(kind==="leadership"){ delete state.leadership[id]; state.leadershipOrder = state.leadershipOrder.filter(x=>x!==id); }
  persist(); renderAll();
}

/* =====================================================================
   MAIN RENDER
   ===================================================================== */
function renderFormPanel(){
  const panel = document.getElementById('formPanel');
  switch(state.activeTab){
    case "contact": panel.innerHTML = renderContactTab(); break;
    case "summary": panel.innerHTML = renderSummaryTab(); break;
    case "experience": panel.innerHTML = renderExperienceTab(); break;
    case "education": panel.innerHTML = renderEducationTab(); break;
    case "leadership": panel.innerHTML = renderLeadershipTab(); break;
    case "additional": panel.innerHTML = renderAdditionalTab(); break;
    case "job": panel.innerHTML = renderJobTab(); break;
    case "review": panel.innerHTML = renderReviewTab(); break;
  }
  // populate coaching feedback for any coachable fields present
  panel.querySelectorAll('[data-coach]').forEach(el => updateCoachFeedback(el));
}

function updateCoachFeedback(el){
  const kind = el.getAttribute('data-coach');
  if(kind === "job"){
    const area = document.getElementById('jobMatchArea');
    if(area) area.innerHTML = renderJobMatch(matchKeywords());
    return;
  }
  const fb = document.getElementById(el.id + "-feedback");
  if(!fb) return;
  if(kind === "summary"){
    fb.innerHTML = renderFlagList(analyzeSummary(el.value), "Reads clearly.");
  } else if(kind === "bullets"){
    fb.innerHTML = renderFlagList(analyzeBulletsBlock(el.value), "Looks solid.");
  }
}

function renderAll(){
  renderRail();
  renderFormPanel();
  renderPreview();
  document.title = state.contact.name ? (state.contact.name + " — Resume") : "Resume Builder & Job-Match Coach";
}

document.addEventListener('input', function(e){
  const path = e.target.getAttribute('data-path');
  if(!path) return;
  setPath(state, path, e.target.value);
  persist();
  renderPreview();
  renderRail();
  if(path === "contact.name") document.title = e.target.value ? (e.target.value + " — Resume") : "Resume Builder & Job-Match Coach";
  if(e.target.hasAttribute('data-coach')) updateCoachFeedback(e.target);
});

/* =====================================================================
   INIT
   ===================================================================== */
(function init(){
  const loaded = loadFromStorage();
  if(!loaded) seedIfEmpty();
  else {
    // recompute idCounter so future genId() calls don't collide with restored ids
    const allIds = [].concat(state.experienceOrder||[], state.educationOrder||[], state.leadershipOrder||[]);
    allIds.forEach(id => { const n = parseInt(id.slice(1),10); if(!isNaN(n) && n > idCounter) idCounter = n; });
    seedIfEmpty();
  }
  renderAll();
})();
</script>
